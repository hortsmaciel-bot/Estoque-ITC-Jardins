const tip=$("#tip");
document.addEventListener("pointermove",ev=>{ const el=ev.target.closest&&ev.target.closest("[data-tip]"); if(!el){tip.hidden=true;return} tip.innerHTML=el.getAttribute("data-tip"); tip.hidden=false; const w=tip.offsetWidth,h=tip.offsetHeight; let x=ev.clientX+14,y=ev.clientY-h-10; if(x+w>innerWidth-8)x=ev.clientX-w-14; if(y<8)y=ev.clientY+16; tip.style.left=x+"px"; tip.style.top=y+"px" });
document.addEventListener("pointerleave",()=>tip.hidden=true);

/* ---------- login (Supabase Auth) & boot ---------- */
let LM="login"; // login | forgot | newpass
const hashAtLoad=location.hash||"";
function setLoginMode(m,msg){
  LM=m; const t=$("#login-title"), sub=$("#login-sub"), btn=$("#login-btn"), alt=$("#login-alt");
  $("#f-email").hidden=m==="newpass"; $("#f-pw").hidden=m==="forgot"; $("#f-pw2").hidden=m!=="newpass";
  $("#em").required=m!=="newpass"; $("#pw").required=m!=="forgot"; $("#pw2").required=m==="newpass";
  $("#pw").autocomplete=m==="newpass"?"new-password":"current-password";
  $("#login-err").hidden=true; $("#login-ok").hidden=!msg; if(msg) $("#login-ok").textContent=msg;
  if(m==="login"){ t.textContent="Estoque do Cadaver Lab"; sub.textContent="Acesso restrito à equipe do ITC Jardins."; btn.textContent="Entrar"; alt.hidden=false; alt.textContent="Esqueci minha senha"; alt.dataset.k="forgot" }
  if(m==="forgot"){ t.textContent="Recuperar senha"; sub.textContent="Enviaremos um link para você criar uma nova senha."; btn.textContent="Enviar link"; alt.hidden=false; alt.textContent="Voltar para o login"; alt.dataset.k="login" }
  if(m==="newpass"){ t.textContent="Criar nova senha"; sub.textContent="Escolha uma senha com pelo menos 8 caracteres."; btn.textContent="Salvar senha e entrar"; alt.hidden=true }
}
function showLogin(msg,mode){
  document.body.classList.add("locked"); $("#login").hidden=false; closeModal();
  setLoginMode(mode||"login");
  const e=$("#login-err"); if(msg){e.textContent=msg;e.hidden=false}
  const f=LM==="newpass"?$("#pw"):($("#em").value?$("#pw"):$("#em")); $("#pw").value=""; $("#pw2").value=""; setTimeout(()=>f.focus(),50);
}
function hideLogin(){ document.body.classList.remove("locked"); $("#login").hidden=true }
const AUTH_MSG=m=>/Invalid login credentials/i.test(m)?"E-mail ou senha incorretos.":/Email not confirmed/i.test(m)?"Confirme seu e-mail antes de entrar (veja a caixa de entrada).":/rate limit|too many/i.test(m)?"Muitas tentativas. Aguarde alguns minutos.":/should be different/i.test(m)?"A nova senha precisa ser diferente da atual.":/at least|weak|short/i.test(m)?"Senha fraca: use pelo menos 8 caracteres.":m;
async function doLogin(){
  const btn=$("#login-btn"), e=$("#login-err"), label=btn.textContent; btn.disabled=true; btn.textContent="Aguarde…"; e.hidden=true; $("#login-ok").hidden=true;
  try{
    if(LM==="login"){
      const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
      if(error) throw error; $("#pw").value=""; await start(); if(Q.length) flush();
    } else if(LM==="forgot"){
      const {error}=await sb.auth.resetPasswordForEmail($("#em").value.trim(),{redirectTo:location.origin+location.pathname});
      if(error) throw error; setLoginMode("login","Se o e-mail estiver cadastrado, você receberá um link para criar uma nova senha.");
    } else {
      if($("#pw").value.length<8) throw {message:"Senha fraca: use pelo menos 8 caracteres."};
      if($("#pw").value!==$("#pw2").value) throw {message:"As senhas não conferem."};
      const {error}=await sb.auth.updateUser({password:$("#pw").value});
      if(error) throw error; try{history.replaceState(null,"",location.pathname)}catch(_){}
      toast("Senha definida."); await start();
    }
  }catch(err){ e.textContent=AUTH_MSG(err.message||"Não foi possível concluir."); e.hidden=false }
  finally{ btn.disabled=false; btn.textContent=label }
}
async function start(){
  if(!sb){ hideLogin(); S.mode="offline"; S.offMsg=window.supabase?"Configure o Supabase no arquivo config.js (URL do projeto e chave anon/publishable).":"Não foi possível carregar a biblioteca do Supabase. Verifique a internet."; render(); return }
  S.mode="loading";
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ showLogin(); return }
  if(/type=(recovery|invite)/.test(hashAtLoad)&&!start._pw){ start._pw=true; showLogin(null,"newpass"); return }
  try{
    const data=await loadAll();
    hideLogin(); S.mode="db"; applyServer(data,true); subscribeLive();
    if(!S.cl||!S.cl.id) S.cl=null;
    if(!Object.keys(S.items).length&&!Object.keys(S.eventos).length) toast("Nenhum dado visível: confira se seu e-mail está na tabela equipe do Supabase.");
    render();
  }catch(e){
    const k=errOf(e);
    if(k.kind==="auth") showLogin(k.message);
    else { hideLogin(); S.mode="offline"; S.offMsg=k.message; render() }
  }
}
const h0=(location.hash||"").slice(1); if(TABS.some(t=>t[0]===h0)) S.tab=h0;
if(sb) sb.auth.onAuthStateChange((ev)=>{ if(ev==="PASSWORD_RECOVERY"){ start._pw=true; showLogin(null,"newpass") } if(ev==="SIGNED_OUT"&&S.mode==="db"){ unsubscribeLive(); S.mode="loading"; showLogin("Você saiu do sistema.") } });
setInterval(()=>{ if(document.visibilityState==="visible"&&!S.live) refresh() },30000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refresh() });
window.addEventListener("online",()=>{ if(Q.length) flush(); else refresh() });
window.addEventListener("beforeunload",ev=>{ if(Q.length||flushP){ ev.preventDefault(); ev.returnValue="" } });
start();
})();
</script>
